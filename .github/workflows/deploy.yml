name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    environment: production

    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate API base URL
        run: |
          node <<'NODE'
          const value = process.env.NEXT_PUBLIC_API_BASE_URL;

          if (!value) {
            throw new Error(
              'Falta vars.NEXT_PUBLIC_API_BASE_URL en el entorno production'
            );
          }

          const url = new URL(value);

          if (url.protocol !== 'https:') {
            throw new Error('La URL de la API debe utilizar HTTPS');
          }

          console.log('API host:', url.host);
          console.log('API path:', url.pathname);
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:coverage

      - name: Build static site
        run: npm run build

      - name: Verify static export
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail

          test -d out
          test -n "$API_BASE_URL"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const expectedHost = new URL(
            process.env.API_BASE_URL
          ).host;

          let matches = 0;

          function scan(dir) {
            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const file = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                scan(file);
              } else if (/\.(js|html)$/.test(file)) {
                const content = fs.readFileSync(file, 'utf8');

                if (content.includes(expectedHost)) {
                  matches++;
                }
              }
            }
          }

          scan('out');

          if (matches === 0) {
            throw new Error(
              'El host de la API no aparece en el export estático. ' +
              'Revisa NEXT_PUBLIC_API_BASE_URL y cómo construyes las peticiones.'
            );
          }

          console.log(
            `API host verificado en ${matches} archivo(s) del export.`
          );
          NODE

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish static site to Scaleway
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      AWS_DEFAULT_REGION: fr-par
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      BUCKET: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}

    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out/

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          test -n "$AWS_ACCESS_KEY_ID" || {
            echo "Falta SCALEWAY_ACCESS_KEY"
            exit 1
          }

          test -n "$AWS_SECRET_ACCESS_KEY" || {
            echo "Falta SCALEWAY_SECRET_KEY"
            exit 1
          }

          test -n "$BUCKET" || {
            echo "Falta SCALEWAY_STORAGE_BUCKET"
            exit 1
          }

          test -f out/index.html || {
            echo "No existe out/index.html"
            exit 1
          }

          echo "Bucket configurado."
          echo "Archivos listos para publicar: $(find out -type f | wc -l)"

      - name: Install AWS CLI
        run: |
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify bucket access
        run: |
          aws s3api head-bucket \
            --bucket "$BUCKET" \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Publish static files
        run: |
          set -euo pipefail

          aws s3 sync ./out/ "s3://${BUCKET}/" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --delete

          echo "Publicación completada."

      - name: Verify published website
        run: |
          echo "Verifica el sitio en:"
          echo "https://${BUCKET}.s3-website.fr-par.scw.cloud/"
