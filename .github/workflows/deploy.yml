name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publish static site to Scaleway
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    env:
      AWS_REGION: fr-par
      AWS_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      SCALEWAY_STORAGE_BUCKET: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}
      SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Apply Scaleway storage infrastructure
        working-directory: infra/scaleway-static-site
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SCW_PROJECT_ID: ${{ env.SCW_PROJECT_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ env.SCW_DEFAULT_PROJECT_ID }}
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCALEWAY_STORAGE_BUCKET: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}
          TF_VAR_bucket_name: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}
          TF_VAR_project_id: ${{ secrets.SCW_PROJECT_ID }}
          TF_VAR_region: fr-par
        run: |
          set -euo pipefail
          for name in SCALEWAY_STORAGE_BUCKET SCW_PROJECT_ID SCW_ACCESS_KEY SCW_SECRET_KEY; do
            value="${!name:-}"
            if [[ -z "$value" || ! "$value" =~ [^[:space:]] ]]; then
              echo "Missing or effectively empty $name production secret" >&2
              exit 1
            fi
          done
          echo "Production secret lengths: bucket=${#SCALEWAY_STORAGE_BUCKET} project=${#SCW_PROJECT_ID} access=${#SCW_ACCESS_KEY} secret=${#SCW_SECRET_KEY}" >&2
          terraform init -backend=false -input=false
          terraform import scaleway_object_bucket_website_configuration.static_site "${AWS_REGION}/${SCALEWAY_STORAGE_BUCKET}@${SCW_PROJECT_ID}" || true
          terraform import scaleway_object_bucket_policy.static_site_public_read "${AWS_REGION}/${SCALEWAY_STORAGE_BUCKET}@${SCW_PROJECT_ID}" || true
          echo "Bucket identity is not managed by this workflow; the existing Scaleway bucket is reused."
          terraform apply -input=false -auto-approve \
            -var "bucket_name=${SCALEWAY_STORAGE_BUCKET}" \
            -var "project_id=${SCW_PROJECT_ID}" \
            -var "region=${AWS_REGION}"

      - name: Publish to Object Storage
        env:
          SCALEWAY_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCALEWAY_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCALEWAY_STORAGE_BUCKET: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y s3cmd
          printf '[default]\naccess_key=%s\nsecret_key=%s\nhost_base=s3.fr-par.scw.cloud\nhost_bucket=%%(bucket)s.s3.fr-par.scw.cloud\nuse_https=True\n'             "${SCALEWAY_ACCESS_KEY}" "${SCALEWAY_SECRET_KEY}" > "${HOME}/.s3cfg"
          s3cmd --no-mime-magic --guess-mime-type --delete-removed \
            --exclude "*.html" \
            --add-header="Cache-Control:public,max-age=31536000,immutable" \
            sync out/ "s3://${SCALEWAY_STORAGE_BUCKET}/"
          s3cmd --no-mime-magic --guess-mime-type --delete-removed \
            --exclude "*" --include "*.html" \
            --add-header="Cache-Control:public,max-age=300" \
            --add-header="Content-Type:text/html; charset=utf-8" \
            sync out/ "s3://${SCALEWAY_STORAGE_BUCKET}/"
          s3cmd put \
            --add-header="Cache-Control:public,max-age=300" \
            --add-header="Content-Type:text/html; charset=utf-8" \
            out/404.html "s3://${SCALEWAY_STORAGE_BUCKET}/404.html"
