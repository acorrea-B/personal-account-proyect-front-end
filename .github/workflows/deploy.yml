name: Deploy

on:
  push:
    tags:
      - 'v*'
  # Manual redeploy (also production); the two jobs rebuild the artifact and
  # deploy with no extra configuration.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    environment: production
    # Forks never run production deploys.
    if: ${{ github.event.repository.fork == false }}

    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate API base URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEXT_PUBLIC_API_BASE_URL//[[:space:]]/}" ]]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL is missing in the production environment variables."
            exit 1
          fi

      - name: Write production environment file
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env .env.local .env.*.local
          printf 'NEXT_PUBLIC_API_BASE_URL=%s\n' "$NEXT_PUBLIC_API_BASE_URL" > .env.production
          printf 'NODE_ENV=production\n' >> .env.production

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build static site
        run: npm run build:isolated
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Verify API URL is embedded in the static export
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          test -n "$NEXT_PUBLIC_API_BASE_URL"
          grep -R -F \
            --include='*.js' \
            "$NEXT_PUBLIC_API_BASE_URL" \
            out/_next/static/chunks >/dev/null

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Scaleway Object Storage
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    # Forks never deploy.
    if: ${{ github.event.repository.fork == false }}

    env:
      SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
      SCW_DEFAULT_REGION: fr-par
      AWS_REGION: fr-par
      AWS_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      TF_VAR_project_id: ${{ secrets.SCW_PROJECT_ID }}
      TF_VAR_region: fr-par
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: fr-par
      TF_VAR_bucket_name: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}
      TF_VAR_site_directory: ../../out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out/

      - name: Validate Scaleway credentials and configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in SCW_ACCESS_KEY SCW_SECRET_KEY \
                      SCW_DEFAULT_PROJECT_ID TF_VAR_bucket_name; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Required configuration is empty: $name"
              exit 1
            fi
          done

          test -d out
          test -f out/index.html

          echo "Scaleway configuration variables are present."
          echo "Static export is present."

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra/scaleway-static-site
        run: terraform init -input=false -no-color

      - name: Validate Terraform configuration
        working-directory: infra/scaleway-static-site
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Import existing Scaleway resources
        working-directory: infra/scaleway-static-site
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="${TF_VAR_bucket_name}"
          PROJECT="${TF_VAR_project_id}"
          REGION="${TF_VAR_region}"

          # Imports are discovery, not a gate: when the resource is absent from
          # the state and does not exist remotely yet, apply creates it. The
          # import failure is tolerated, never hard-fails the deploy.
          if ! terraform state show -no-color scaleway_object_bucket.web >/dev/null 2>&1; then
            terraform import -no-color \
              scaleway_object_bucket.web \
              "${REGION}/${BUCKET}@${PROJECT}" \
              || echo "::warning::scaleway_object_bucket.web could not be imported; apply will create it"
          fi

          if ! terraform state show -no-color scaleway_object_bucket_policy.web >/dev/null 2>&1; then
            terraform import -no-color \
              scaleway_object_bucket_policy.web \
              "${REGION}/${BUCKET}@${PROJECT}" \
              || echo "::warning::scaleway_object_bucket_policy.web could not be imported; apply will create it"
          fi

          if ! terraform state show -no-color scaleway_object_bucket_website_configuration.web >/dev/null 2>&1; then
            terraform import -no-color \
              scaleway_object_bucket_website_configuration.web \
              "${REGION}/${BUCKET}@${PROJECT}" \
              || echo "::warning::scaleway_object_bucket_website_configuration.web could not be imported; apply will create it"
          fi

          terraform state list -no-color

      - name: Plan infrastructure and website deployment
        working-directory: infra/scaleway-static-site
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Apply infrastructure and website deployment
        working-directory: infra/scaleway-static-site
        run: terraform apply -no-color -input=false -auto-approve tfplan

      - name: Smoke test the static site
        working-directory: infra/scaleway-static-site
        shell: bash
        run: |
          set -euo pipefail
          URL="$(terraform output -raw website_endpoint)"
          [[ "$URL" == http* ]] || URL="https://${URL}"

          # A deploy is only sound when the public endpoint answers, not
          # when Terraform reports success.
          for attempt in $(seq 1 8); do
            code="$(curl --silent --max-time 10 -o /dev/null --write-out '%{http_code}' "$URL/" || true)"
            if [ "$code" = "200" ]; then
              echo "The website answers 200 at $URL/"
              exit 0
            fi
            echo "Attempt $attempt: $URL/ returned '$code'"
            sleep 5
          done
          echo "::error::the smoke test failed at $URL/ (the bucket and the files were deployed)"
          exit 1

      - name: Record the deployed version
        working-directory: infra/scaleway-static-site
        shell: bash
        run: |
          set -euo pipefail
          URL="$(terraform output -raw website_endpoint)"
          {
            echo "Deployed \`${GITHUB_SHA}\` to production."
            echo ""
            echo "Website endpoint: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
