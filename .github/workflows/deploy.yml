name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publish static site to Scaleway
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    env:
      AWS_REGION: fr-par
      AWS_ENDPOINT_URL: https://s3.fr-par.scw.cloud
      SCALEWAY_STORAGE_BUCKET: ${{ secrets.SCALEWAY_STORAGE_BUCKET }}
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out

      - name: Configure Scaleway credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SCALEWAY_SECRET_KEY }}
          aws-region: fr-par

      - name: Publish to Object Storage
        run: |
          set -euo pipefail
          aws s3 sync out/ "s3://${SCALEWAY_STORAGE_BUCKET}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out/ "s3://${SCALEWAY_STORAGE_BUCKET}/" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=300" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp out/404.html "s3://${SCALEWAY_STORAGE_BUCKET}/404.html" \
            --cache-control "public,max-age=300" \
            --content-type "text/html; charset=utf-8"

      # Website config, public access and bucket policy are owned by Terraform.
      # The GitHub Actions credentials only publish static artifacts here.
