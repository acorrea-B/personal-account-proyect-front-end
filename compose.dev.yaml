# Containerized dev server with live reload: docker compose -f compose.dev.yaml up
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pap-web-dev
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      # Separate dist dir so a host-side next dev on .next never races this one.
      NEXT_DIST_DIR: .next-docker
      # Bind mounts do not always forward inotify events (WSL2, Docker Desktop).
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - .:/app
      # Keep the image's node_modules instead of the host's.
      - node_modules:/app/node_modules

volumes:
  node_modules:
